[package]
name = "crate-sentinel-mcp"
description = "Rust MCP server for governed dependency upgrades in Rust workspaces."
version = "0.1.1"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/ARyaskov/crate-sentinel-mcp"
keywords = [
    "mcp",
    "api-diff",
    "cargo",
    "dependency",
    "versioning"
]
categories = [
    "development-tools",
    "command-line-utilities"
]

[dependencies]
anyhow = "1"
cargo_metadata = "0.21"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rmcp = { version = "0.15", features = ["server", "macros", "transport-io", "schemars"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
tempfile = "3"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
chrono = { version = "0.4", default-features = true, features = ["clock"] }
uuid = { version = "1", features = ["v4"] }
